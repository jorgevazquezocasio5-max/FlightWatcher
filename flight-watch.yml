name: Flight watch

on:
  schedule:
    - cron: "17 */2 * * *"      # every 2 hours (UTC); GitHub may delay runs a few minutes
  workflow_dispatch:
    inputs:
      test:
        description: "Only send a test text (no flight search)"
        type: boolean
        default: false

permissions:
  contents: write                # lets the job commit data/ back to the repo

concurrency:
  group: flight-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send test text
        if: ${{ inputs.test }}
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python flight_bot.py --test

      - name: Check flights
        if: ${{ !inputs.test }}
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python flight_bot.py

      - name: Save price history and alert state
        if: ${{ always() && !inputs.test }}
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update flight data" && git push)
